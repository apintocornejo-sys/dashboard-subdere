name: Actualización automática SUBDERE

# Se puede lanzar de 2 formas:
#   1. Automática, según el horario de abajo (schedule)
#   2. Manual, en cualquier momento, desde la pestaña "Actions" de GitHub
#      (funciona desde el navegador o desde la app de GitHub en el celular,
#      desde cualquier lugar) — botón "Run workflow"
on:
  schedule:
    # Los horarios de "cron" de GitHub siempre son en UTC, NO en hora de Chile.
    # 08:00 / 13:00 / 17:00 de Chile (horario de verano, UTC-3) = 11:00 / 16:00 / 20:00 UTC.
    # ⚠️ Cuando Chile cambie a horario de invierno (UTC-4), estos horarios se
    # atrasan 1 hora en la práctica — hay que sumar 1 a cada número de aquí
    # abajo (12,17,21) para que sigan siendo las 08:00/13:00/17:00 reales.
    # Por ahora corre de lunes a viernes; para incluir fines de semana,
    # cambiar "1-5" por "*".
    - cron: '0 11,16,20 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: actualizacion-subdere
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Xvfb (pantalla virtual — SUBDERE bloquea navegadores sin pantalla)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Instalar dependencias de Python
        run: |
          pip install --break-system-packages \
            playwright==1.48.0 \
            pandas lxml html5lib \
            google-auth google-auth-oauthlib google-api-python-client

      - name: Instalar navegador Chromium para Playwright
        run: python3 -m playwright install --with-deps chromium

      - name: Reconstruir credenciales desde los secretos de GitHub
        env:
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          echo "$GOOGLE_CLIENT_SECRET_JSON" > client_secret.json
          echo "$GOOGLE_TOKEN_JSON" > token.json

      - name: Configurar identidad de git (para el commit automático)
        run: |
          git config user.name "Agente SUBDERE (automático)"
          git config user.email "actions@github.com"

      - name: Correr el agente (con pantalla virtual)
        env:
          SUBDERE_USUARIO: ${{ secrets.SUBDERE_USUARIO }}
          SUBDERE_CLAVE: ${{ secrets.SUBDERE_CLAVE }}
        run: xvfb-run --auto-servernum python3 scripts/agente_actualizacion.py

      - name: Subir capturas de depuración si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-subdere
          path: debug/
          retention-days: 5
