name: Actualización automática SUBDERE

# Se puede lanzar de 2 formas:
#   1. Automática, según el horario de abajo (schedule)
#   2. Manual, en cualquier momento, desde la pestaña "Actions" de GitHub
#      (funciona desde el navegador o desde la app de GitHub en el celular,
#      desde cualquier lugar) — botón "Run workflow"
on:
  schedule:
    # Los horarios de "cron" de GitHub son siempre en UTC.
    # Se programa en AMBOS husos de Chile (verano UTC-3 e invierno UTC-4) y el
    # trabajo "hora" deja pasar solo las ejecuciones que caen a las 08:00,
    # 13:00 o 17:00 reales de Chile (America/Santiago). Así no hay que tocar
    # nada cuando cambia la hora. Las otras ejecuciones se omiten en segundos.
    # Corre de lunes a viernes; para incluir fines de semana, cambiar "1-5" por "*".
    - cron: '0 11,12,16,17,20,21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: actualizacion-subdere
  cancel-in-progress: false

jobs:
  hora:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      correr: ${{ steps.chk.outputs.correr }}
    steps:
      - id: chk
        name: Verificar que sea hora de ejecución en Chile
        run: |
          H=$(TZ=America/Santiago date +%H)
          echo "Hora actual en Chile: $H h"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "correr=true" >> "$GITHUB_OUTPUT"   # lanzamiento manual: siempre
          else
            case "$H" in
              08|13|17) echo "correr=true" >> "$GITHUB_OUTPUT" ;;
              *)        echo "correr=false" >> "$GITHUB_OUTPUT"; echo "Fuera de horario, se omite." ;;
            esac
          fi

  actualizar:
    needs: hora
    if: needs.hora.outputs.correr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Xvfb (pantalla virtual — SUBDERE bloquea navegadores sin pantalla)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Instalar dependencias de Python
        run: |
          pip install --break-system-packages \
            playwright==1.48.0 \
            pandas lxml html5lib \
            google-auth google-auth-oauthlib google-api-python-client

      - name: Instalar navegador Chromium para Playwright
        run: python3 -m playwright install --with-deps chromium

      - name: Reconstruir credenciales desde los secretos de GitHub
        env:
          GOOGLE_CLIENT_SECRET_B64: ${{ secrets.GOOGLE_CLIENT_SECRET_B64 }}
          GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
        run: |
          echo "$GOOGLE_CLIENT_SECRET_B64" | base64 -d > client_secret.json
          echo "$GOOGLE_TOKEN_B64" | base64 -d > token.json
          python3 -c "import json; json.load(open('client_secret.json')); json.load(open('token.json')); print('JSON válido ✓')"

      - name: Configurar identidad de git (para el commit automático)
        run: |
          git config user.name "Agente SUBDERE (automático)"
          git config user.email "actions@github.com"

      - name: Correr el agente (con pantalla virtual)
        env:
          SUBDERE_USUARIO: ${{ secrets.SUBDERE_USUARIO }}
          SUBDERE_CLAVE: ${{ secrets.SUBDERE_CLAVE }}
        run: xvfb-run --auto-servernum python3 scripts/agente_actualizacion.py

      - name: Subir capturas de depuración si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-subdere
          path: debug/
          retention-days: 5

      - name: Avisar con un issue de GitHub si el agente falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "⚠️ Falló la actualización automática ($(date +%F))" \
            --body "El agente terminó con error. Revisa el log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Causa frecuente: token de Google vencido (renovar el secreto GOOGLE_TOKEN_B64) o cambio en SUBDERE en Línea." || true
